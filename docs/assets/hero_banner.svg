<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Glowing background orbs -->
  <circle cx="200" cy="120" r="90" fill="#6366f1" opacity="0.18" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="110" fill="#a855f7" opacity="0.15" filter="url(#glow)"/>
  <circle cx="650" cy="220" r="130" fill="#0284c7" opacity="0.1" filter="url(#glow)"/>

  <!-- Platform Badge -->
  <rect x="70" y="60" width="180" height="32" rx="16" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.2"/>
  <circle cx="88" cy="76" r="4" fill="#38bdf8"/>
  <text x="100" y="81" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" letter-spacing="1">v1.0.0 PRODUCTION</text>

  <!-- Title -->
  <text x="70" y="145" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#primary)" letter-spacing="-1">
    ML Experiment Orchestrator
  </text>
  <text x="70" y="185" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1">
    Autonomous Machine Learning, Optuna AutoML &amp; LangGraph Agentic Platform
  </text>
  <text x="70" y="215" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#64748b">
    Full-stack MLOps ecosystem orchestrating datasets, distributed runs, FAISS RAG, and executive reports.
  </text>

  <!-- Tech Stack Pills -->
  <g transform="translate(70, 260)">
    <!-- FastAPI -->
    <rect x="0" y="0" width="115" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="57" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ FastAPI</text>
    <!-- Streamlit -->
    <rect x="125" y="0" width="125" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="187" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#f43f5e" text-anchor="middle">🎨 Streamlit</text>
    <!-- PostgreSQL -->
    <rect x="260" y="0" width="135" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="327" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#60a5fa" text-anchor="middle">🐘 PostgreSQL</text>
    <!-- MLflow -->
    <rect x="405" y="0" width="115" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="462" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#0284c7" text-anchor="middle">🧪 MLflow</text>
    <!-- Optuna -->
    <rect x="530" y="0" width="115" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="587" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#a855f7" text-anchor="middle">🎯 Optuna</text>
    <!-- LangGraph -->
    <rect x="655" y="0" width="135" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="722" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">🤖 LangGraph</text>
    <!-- Gemini 1.5 -->
    <rect x="800" y="0" width="135" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="867" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">✨ Gemini 1.5</text>
    <!-- Docker -->
    <rect x="945" y="0" width="110" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="1000" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">🐳 Docker</text>
  </g>

  <!-- Metric Badges Bottom Strip -->
  <g transform="translate(70, 335)">
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">9 Dedicated Studios</text>
    <text x="140" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#475569">•</text>
    <text x="160" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Multi-Model Bayesian AutoML</text>
    <text x="360" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#475569">•</text>
    <text x="380" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">FAISS RAG Knowledge Base</text>
    <text x="560" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#475569">•</text>
    <text x="580" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Executive PDF Audits</text>
    <text x="735" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#475569">•</text>
    <text x="755" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">100% Python Full-Stack</text>
  </g>
</svg>